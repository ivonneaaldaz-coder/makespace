:root{--wine:#501923;--cream:#f6f0e8;--ink:#342729}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}a{color:inherit}header{background:var(--wine);color:var(--cream)}header .wrap{display:flex;align-items:center;justify-content:space-between;padding:22px 0}.wrap{width:min(1180px,calc(100% - 64px));margin:auto}.logo img{display:block;width:112px;height:auto}nav{display:flex;gap:27px}nav a{font-size:11px;letter-spacing:.13em;text-decoration:none;text-transform:uppercase}.serif{font-family:"Italiana",Georgia,serif;font-weight:400;line-height:.96;color:var(--wine)}main{min-height:55vh;padding:65px 0 90px}.backlink{display:inline-block;font-size:11px;letter-spacing:.14em;text-decoration:none;margin-bottom:55px}.detailgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.7fr);gap:clamp(25px,7vw,115px);align-items:start}.detailgrid h1{font-size:clamp(58px,8vw,110px);margin:22px 0 40px}.kicker{font-size:10px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--wine)}.experience-image{display:block;width:100%;max-height:620px;object-fit:cover;aspect-ratio:1.4;border-radius:2px}.description{max-width:680px;font-size:18px;line-height:1.75;white-space:pre-wrap}.details{background:#eee2d9;border:1px solid #e1d1cb;padding:clamp(24px,3vw,39px)}.details p{font-size:15px;line-height:1.75;border-bottom:1px solid #d5c4bb;padding-bottom:16px;margin:22px 0}.details b{font-size:10px;letter-spacing:.15em}.booking{background:var(--wine);color:var(--cream);padding:18px!important;text-align:center;text-transform:uppercase;letter-spacing:.12em;font-size:11px!important}.details small{color:#7c6765;font-size:11px}footer{background:var(--wine);color:var(--cream);padding:45px 0}footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:15px}footer a{font-size:12px;text-decoration:none}
