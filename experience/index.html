<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#501923"><title>Experience | MAKE SPACE</title>
<meta name="description" content="Discover creative pop-ups and gatherings by MAKE SPACE, a creative social club in San Antonio.">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{--wine:#501923;--cream:#f6f0e8;--ink:#342729}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}a{color:inherit}header{background:var(--wine);color:var(--cream)}header .wrap{display:flex;align-items:center;justify-content:space-between;padding:22px 0}.wrap{width:min(1180px,calc(100% - 64px));margin:auto}.logo img{display:block;width:112px;height:auto}nav{display:flex;gap:27px}nav a{font-size:11px;letter-spacing:.13em;text-decoration:none;text-transform:uppercase}.serif{font-family:"Italiana",Georgia,serif;font-weight:400;line-height:.96;color:var(--wine)}main{min-height:55vh;padding:65px 0 90px}.backlink{display:inline-block;font-size:11px;letter-spacing:.14em;text-decoration:none;margin-bottom:55px}.detailgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.7fr);gap:clamp(25px,7vw,115px);align-items:start}.detailgrid h1{font-size:clamp(50px,6.3vw,88px);margin:22px 0 40px;overflow-wrap:normal}.kicker{font-size:10px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--wine)}.experience-image{display:block;width:100%;max-height:620px;object-fit:cover;aspect-ratio:1.4;border-radius:2px}.description{max-width:680px;font-size:18px;line-height:1.75;white-space:pre-wrap}.details{background:#eee2d9;border:1px solid #e1d1cb;padding:clamp(24px,3vw,39px)}.details p{font-size:15px;line-height:1.75;border-bottom:1px solid #d5c4bb;padding-bottom:16px;margin:22px 0}.details b{font-size:10px;letter-spacing:.15em}.booking{display:block;text-decoration:none;background:var(--wine);color:var(--cream);padding:18px!important;text-align:center;text-transform:uppercase;letter-spacing:.12em;font-size:11px!important}.square-checkout:hover{background:#703744}.square-checkout:focus-visible{outline:3px solid #955260;outline-offset:3px}.details small{color:#7c6765;font-size:11px}footer{background:var(--wine);color:var(--cream);padding:45px 0}footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:15px}footer a{font-size:12px;text-decoration:none}
@media(max-width:700px){.wrap{width:calc(100% - 30px)}header .wrap{padding:20px 0}.logo img{width:96px}nav{gap:12px}nav a{font-size:9px}main{padding:40px 0 70px}.backlink{margin-bottom:40px}.detailgrid{grid-template-columns:1fr;gap:35px}.detailgrid h1{font-size:clamp(49px,11vw,75px);margin:15px 0 28px}.experience-image{aspect-ratio:1.1}.description{font-size:16px}footer .wrap{display:block}}
</style>
<style id="makespace-soft-shapes">
/* KEEP CTA controls pill-shaped; restore straight-edged imagery everywhere. */
button,.btn,.button,.cta,.calendar-pill,.signup button,.control,.monthnav button,
input[type="submit"],a[role="button"],a.square-checkout,.booking,.submit,
#clerk-sign-in button{border-radius:999px}
.hero .float,.hero .float img,.float.one,.float.two,.float.three,.float.four,
.floating-image,.floating-image img,.event,.event img,.event .live-artwork,
.about img,.private img,.photo,.experience-image,.previewphoto,.previewphoto img,
.gallery img,.hero img,.card img,.surface img,.event-image,.access-card{
  border-radius:0;
}
/* Some components have previous per-section rounded styles. */
</style><style id="sitewide-footer">
footer#community{display:block!important;margin:0;background:#501923;color:#f6f0e8;padding:95px 0 30px}
footer#community .wrap{width:min(1180px,calc(100% - 64px));margin:auto;display:block!important}
footer#community .footer-top{display:grid;grid-template-columns:1fr 1fr;gap:8vw;align-items:end}
footer#community .footer-top h2{font:400 clamp(67px,7vw,110px)/.86 "Italiana",Georgia,serif;letter-spacing:-.05em;color:#f6f0e8;margin:18px 0}
footer#community .signup{display:flex;border-bottom:1px solid #c3a6a2;align-items:center;padding:12px 0;max-width:520px}
footer#community .signup input{background:transparent;border:0;outline:0;color:#f6f0e8;flex:1;min-width:0;font:400 16px "DM Sans",sans-serif;padding:10px 2px}
footer#community .signup input::placeholder{color:#bca5a3}
footer#community .signup button{border:0;background:transparent;color:#f6f0e8;font-size:25px;cursor:pointer;border-radius:999px;padding:8px 14px}
footer#community .notice{font:400 11px/1.5 "DM Sans",sans-serif;min-height:20px;margin-top:8px;color:#ddbdc2}
footer#community .footer-bottom{border-top:1px solid #936873;margin-top:110px;padding-top:24px;display:flex;justify-content:space-between;align-items:end;gap:20px}
footer#community .bigbrand img{display:block;width:245px;height:auto;max-width:100%}
footer#community .footer-links{display:flex;gap:30px;flex-wrap:wrap;font:400 10px "DM Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;align-items:center}
footer#community .footer-links a{color:inherit;text-decoration:none}
footer#community .footer-links a:hover{text-decoration:underline;text-underline-offset:5px}
footer#community .tiny{font:400 10px "DM Sans",sans-serif;color:#cba7ad;margin-top:23px}
@media(max-width:800px){footer#community .wrap{width:calc(100% - 36px)}footer#community .footer-top{grid-template-columns:1fr;gap:30px}footer#community .footer-bottom{margin-top:70px;flex-direction:column;align-items:flex-start;gap:28px}footer#community .footer-links{gap:16px 22px}}
@media(max-width:520px){footer#community{padding:75px 0 28px}footer#community .footer-top h2{font-size:clamp(55px,12vw,72px)}footer#community .footer-bottom{margin-top:62px}footer#community .bigbrand img{width:175px}footer#community .footer-links a{font-size:9px}}
</style></head><body>
<header><div class="wrap"><a href="/" class="logo" aria-label="MAKE SPACE home"><img src="/assets/makespace-logo.svg" width="112" height="53" alt="MAKE SPACE"></a><nav><a href="/calendar/">Calendar</a><a href="/#about">About</a><a href="/private-events/">Private Events</a></nav></div></header>
<main class="wrap"><div id="experience-detail"><p role="status">Loading experience…</p></div></main>
